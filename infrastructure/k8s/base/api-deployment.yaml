apiVersion: apps/v1
kind: Deployment
metadata:
  name: sars-api
  namespace: sars-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sars-api
  template:
    metadata:
      labels:
        app: sars-api
    spec:
      containers:
        - name: api
          image: sars-platform/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: sars-env
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
